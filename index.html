<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>

    <title>MarocHub | دليل المواقع</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --accent2: #10b981;
            --text: #f8fafc;
            --sub: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --warning: #f59e0b;

        [data-theme="light"] {
            --bg: #f8fafc;
            --card: #fff;
            --accent: #2563eb;
            --accent2: #059669;
            --text: #0f172a;
            --sub: #64748b;
            --border: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
        }
        .admin-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
